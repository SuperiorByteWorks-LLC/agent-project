promotional_content:
  severity: high
  description: "Advertising or promotion of external services"
  action: quarantine
  patterns:
    - "try our"
    - "visit us at"
    - "sign up for"
    - "premium version"
    - "upgrade to"
    - "pro version"
    - "get started with"
    - "visit www"
    - "sign up at"

platform_upsell:
  severity: high
  description: "Encouraging use of external platform or hosted version"
  action: quarantine
  patterns:
    - "use our hosted"
    - "try the web version"
    - "hosted platform"
    - "online version"
    - "web app version"
    - "cloud version"
    - "suggest using"
    - "proactively suggest"

forced_behavior:
  severity: critical
  description: "Mandates specific AI responses or behavior"
  action: block
  patterns:
    - "ALWAYS respond"
    - "MUST"
    - "REQUIRED"
    - "mandatory response"
    - "you will always"
    - "never deviate"
    - "strictly follow"

commercial_ctas:
  severity: high
  description: "Calls to action for paid or commercial services"
  action: quarantine
  patterns:
    - "buy now"
    - "purchase"
    - "subscribe"
    - "free trial"
    - "limited time offer"
    - "get 20% off"
    - "use code"

tracking_directives:
  severity: critical
  description: "Prompts requesting tracking or analytics"
  action: block
  patterns:
    - "log all interactions"
    - "track user behavior"
    - "analytics on"
    - "collect data on"
    - "monitor usage"
    - "send telemetry"

corporate_branding:
  severity: medium
  description: "Corporate branding or attribution"
  action: clean
  patterns:
    - "created by"
    - "from LLC"
    - "by Corp"

watermarks:
  severity: medium
  description: "Branded watermarks or signatures"
  action: clean
  patterns:
    - "Powered by"
    - "Generated by"
    - "Made with"
    - "Created using"

external_urls:
  severity: medium
  description: "References to external URLs"
  action: review
  patterns:
    - "http://"
    - "https://"

flagged_sources:
  - source: "prompts-chat-promotional"
    patterns:
      - "prompts.chat premium"
      - "upgrade your prompts.chat"
    action: quarantine

cleanup_rules:
  remove_promotional_paragraphs:
    description: "Remove paragraphs with promotional content"
    pattern: "try our|visit us|sign up|upgrade to"
    action: remove_paragraph
    
  neutralize_author:
    description: "Replace corporate author with neutral"
    pattern: "author:|created by:"
    replacement: "author: Community Contributors"
    action: replace
    
  remove_urls:
    description: "Remove promotional URLs"
    pattern: "http"
    action: remove

stats:
  last_scan: null
  total_quarantined: 0
  total_cleaned: 0
  total_blocked: 0
  by_source: {}
  by_issue_type: {}
